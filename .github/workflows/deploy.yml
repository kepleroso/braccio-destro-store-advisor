# Pubblica il plugin su WordPress.org (SVN) quando cambia il codice del plugin sul ramo main.
# La versione caricata è quella scritta in VERSION (deve coincidere con "Version" e "Stable tag").
name: Pubblica su WordPress.org
on:
  push:
    branches: [main]
    paths: ['braccio-destro-store-advisor.php', 'readme.txt', '.github/workflows/deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carica su SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ceotrust
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: braccio-destro-store-advisor
          VERSION: '1.0.0'
