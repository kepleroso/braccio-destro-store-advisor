# Pubblica il plugin su WordPress.org (SVN) quando si crea un tag di versione, es. 1.0.0
name: Pubblica su WordPress.org
on:
  push:
    tags: ['*']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carica su SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: braccio-destro-store-advisor
          VERSION: '1.0.0'
